<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Chord Trainer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #00d2ff;
            --accent-hover: #00a8cc;
            --danger: #ff4757;
            --success: #2ed573;
            --group-header: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .chord-display {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        #chord-name {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            min-height: 70px;
        }

        #chord-diagram svg {
            width: 150px;
            height: auto;
        }

        /* Pulse animation on beat */
        .pulse {
            animation: pulse-animation 0.2s ease-out;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        #btn-start { background-color: var(--success); }
        #btn-start:hover { background-color: #26b360; }
        
        #btn-pause { background-color: #ffa502; }
        #btn-pause:hover { background-color: #e59400; }
        
        #btn-stop { background-color: var(--danger); }
        #btn-stop:hover { background-color: #e03e4d; }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        #bpm-val {
            color: var(--accent);
            font-weight: bold;
        }

        /* Modern Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #333;
            border-radius: 3px;
        }

        select, input[type=text] {
            padding: 10px;
            background-color: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        select { cursor: pointer; }
        select:focus, input[type=text]:focus { border-color: var(--accent); }
        
        optgroup {
            color: var(--group-header);
            font-style: normal;
            font-weight: bold;
        }
        option { color: white; }

        /* Custom Input Styling */
        #custom-input-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            cursor: pointer;
            margin-top: 5px;
        }
        .checkbox-label input { cursor: pointer; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Guitar Chord Trainer</h1>
        
        <div class="chord-display" id="display-area">
            <div id="chord-name">Ready</div>
            <div id="chord-diagram">
                <!-- SVG generated by JS goes here -->
            </div>
        </div>

        <div class="controls">
            <button id="btn-start">Start</button>
            <button id="btn-pause" disabled>Pause</button>
            <button id="btn-stop" disabled>Stop</button>
        </div>

        <div class="settings">
            
            <div class="setting-group">
                <label>Chord Category</label>
                <select id="category-select">
                    <optgroup label="Your Selection">
                        <option value="custom">✍️ Custom Input...</option>
                    </optgroup>
                    <optgroup label="Random Practice">
                        <option value="all" selected>All Basic Chords</option>
                        <option value="major">Basic Major Chords</option>
                        <option value="minor">Basic Minor Chords</option>
                        <option value="seventh">Basic Minor Seventh</option>
                    </optgroup>
                    <optgroup label="Song Progressions (Sequential)">
                        <option value="prog_g_pop" data-seq="true">Pop 4-Chord (G - D - Em - C)</option>
                        <option value="prog_c_50s" data-seq="true">50s Ballad (C - Am - Dm - G)</option>
                        <option value="prog_a_rock" data-seq="true">Classic Rock (A - D - E)</option>
                        <option value="prog_em_alt" data-seq="true">Alt Rock (Em - C - G - D)</option>
                    </optgroup>
                </select>
            </div>

            <!-- HIDDEN BY DEFAULT: Custom Input Section -->
            <div class="setting-group" id="custom-input-section" style="display: none;">
                <label>Type chords (e.g., CDE, C, D, Am)</label>
                <input type="text" id="custom-chords" placeholder="C D E..." autocomplete="off">
                <label class="checkbox-label">
                    <input type="checkbox" id="custom-seq">
                    Play in exact order (Sequential)
                </label>
                <div id="custom-feedback" style="font-size: 0.8rem; color: var(--accent); margin-top: 5px;"></div>
            </div>

            <div class="setting-group">
                <label>
                    <span>Speed (Changes per minute)</span>
                    <span id="bpm-val">60 BPM</span>
                </label>
                <input type="range" id="bpm-slider" min="1" max="200" value="60">
            </div>
            
            <div class="setting-group">
                <label>Metronome Sound</label>
                <select id="sound-select">
                    <option value="click">Standard Click</option>
                    <option value="wood">Woodblock</option>
                    <option value="synth">Synth Beep</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // --- CHORD DICTIONARY & CATEGORIES ---
        const chordData = {
            "C":  [[-1,0], [3,3], [2,2], [0,0], [1,1], [0,0]],
            "D":  [[-1,0], [-1,0], [0,0], [2,1], [3,3], [2,2]],
            "E":  [[0,0], [2,2], [2,3], [1,1], [0,0], [0,0]],
            "G":  [[3,3], [2,2], [0,0], [0,0], [0,0], [3,4]],
            "A":  [[-1,0], [0,0], [2,1], [2,2], [2,3], [0,0]],
            
            "Dm": [[-1,0], [-1,0], [0,0], [2,2], [3,3], [1,1]],
            "Em": [[0,0], [2,2], [2,3], [0,0], [0,0], [0,0]],
            "Am": [[-1,0], [0,0], [2,2], [2,3], [1,1], [0,0]],
            
            "C7": [[-1,0], [3,3], [2,2], [3,4], [1,1], [0,0]],
            "D7": [[-1,0], [-1,0], [0,0], [2,2], [1,1], [2,3]],
            "E7": [[0,0], [2,2], [0,0], [1,1], [0,0], [0,0]],
            "G7": [[3,3], [2,2], [0,0], [0,0], [0,0], [1,1]],
            "A7": [[-1,0], [0,0], [2,2], [0,0], [2,3], [0,0]],
            "B7": [[-1,0], [2,2], [1,1], [2,3], [0,0], [2,4]]
        };

        const categories = {
            major: ["C", "D", "E", "G", "A"],
            minor: ["Dm", "Em", "Am"],
            seventh: ["C7", "D7", "E7", "G7", "A7", "B7"],
            prog_g_pop: ["G", "D", "Em", "C"],
            prog_c_50s: ["C", "Am", "Dm", "G"],
            prog_a_rock: ["A", "D", "E"],
            prog_em_alt: ["Em", "C", "G", "D"]
        };

        // --- DOM ELEMENTS ---
        const chordNameEl = document.getElementById('chord-name');
        const chordDiagramEl = document.getElementById('chord-diagram');
        const displayArea = document.getElementById('display-area');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const bpmSlider = document.getElementById('bpm-slider');
        const bpmVal = document.getElementById('bpm-val');
        const soundSelect = document.getElementById('sound-select');
        const categorySelect = document.getElementById('category-select');
        
        const customInputSection = document.getElementById('custom-input-section');
        const customInput = document.getElementById('custom-chords');
        const customSeqToggle = document.getElementById('custom-seq');
        const customFeedback = document.getElementById('custom-feedback');

        // --- STATE VARIABLES ---
        let timerId = null;
        let isPlaying = false;
        let currentBpm = 60;
        let currentChord = "";
        let audioCtx = null;
        let sequenceIndex = 0;

        // --- CUSTOM INPUT PARSER ---
        // Sort keys by length descending so "Am" matches before "A"
        const allAvailableChords = Object.keys(chordData).sort((a, b) => b.length - a.length);
        const chordRegex = new RegExp(allAvailableChords.join('|'), 'gi');

        function getParsedCustomChords() {
            const rawInput = customInput.value;
            const matches = rawInput.match(chordRegex);
            
            if (!matches || matches.length === 0) return ["C"]; // Safe fallback
            
            // Map matches back to exact dictionary casing (e.g. "am" -> "Am")
            return matches.map(match => {
                return allAvailableChords.find(c => c.toLowerCase() === match.toLowerCase());
            });
        }

        function updateFeedback() {
            const parsed = getParsedCustomChords();
            customFeedback.innerText = "Currently Active: " + parsed.join(", ");
        }

        // --- HELPER: Get active chord list ---
        function getActiveChords() {
            const selection = categorySelect.value;
            if (selection === "all") {
                return [...categories.major, ...categories.minor, ...categories.seventh];
            }
            if (selection === "custom") {
                return getParsedCustomChords();
            }
            return categories[selection];
        }

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playMetronome() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const type = soundSelect.value;
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now);
                gainNode.gain.setValueAtTime(1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'wood') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'synth') {
                osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        // --- SVG GENERATOR ---
        function generateChordSVG(stringsArray) {
            let svg = `<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">`;
            for (let i = 0; i <= 5; i++) {
                let y = 30 + (i * 22);
                let weight = i === 0 ? 4 : 1; 
                svg += `<line x1="10" y1="${y}" x2="110" y2="${y}" stroke="var(--text-main)" stroke-width="${weight}"/>`;
            }
            for (let i = 0; i < 6; i++) {
                let x = 10 + (i * 20);
                svg += `<line x1="${x}" y1="30" x2="${x}" y2="140" stroke="var(--text-main)" stroke-width="1"/>`;
            }
            stringsArray.forEach((stringData, stringIdx) => {
                let fret = stringData[0];
                let finger = stringData[1];
                let x = 10 + (stringIdx * 20);
                if (fret === -1) {
                    svg += `<text x="${x}" y="20" fill="var(--danger)" font-size="14" font-weight="bold" text-anchor="middle">X</text>`;
                } else if (fret === 0) {
                    svg += `<circle cx="${x}" cy="18" r="4" stroke="var(--text-main)" fill="none" stroke-width="1.5"/>`;
                } else {
                    let y = 30 + ((fret - 0.5) * 22);
                    svg += `<circle cx="${x}" cy="${y}" r="8.5" fill="var(--accent)"/>`;
                    svg += `<text x="${x}" y="${y}" fill="var(--bg-color)" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">${finger}</text>`;
                }
            });
            svg += `</svg>`;
            return svg;
        }

        // --- APP LOGIC ---
        function nextBeat() {
            const activeChords = getActiveChords();
            const selectedOption = categorySelect.options[categorySelect.selectedIndex];
            
            // Determine if we should play sequentially
            const isPresetSequential = selectedOption.getAttribute('data-seq') === 'true';
            const isCustomSequential = categorySelect.value === 'custom' && customSeqToggle.checked;
            const playInSequence = isPresetSequential || isCustomSequential;
            
            let newChord;
            
            if (playInSequence) {
                newChord = activeChords[sequenceIndex % activeChords.length];
                sequenceIndex++;
            } else {
                do {
                    newChord = activeChords[Math.floor(Math.random() * activeChords.length)];
                } while (newChord === currentChord && activeChords.length > 1);
            }
            
            currentChord = newChord;
            chordNameEl.innerText = currentChord;
            chordDiagramEl.innerHTML = generateChordSVG(chordData[currentChord]);

            displayArea.classList.remove('pulse');
            void displayArea.offsetWidth; 
            displayArea.classList.add('pulse');

            playMetronome();
        }

        function applyTimer() {
            if (timerId) clearInterval(timerId);
            if (isPlaying) {
                const intervalMs = 60000 / currentBpm;
                timerId = setInterval(nextBeat, intervalMs);
            }
        }

        // --- EVENT LISTENERS ---
        btnStart.addEventListener('click', () => {
            initAudio();
            if (!isPlaying) {
                isPlaying = true;
                btnStart.disabled = true;
                btnPause.disabled = false;
                btnStop.disabled = false;
                nextBeat();
                applyTimer();
            }
        });

        btnPause.addEventListener('click', () => {
            isPlaying = false;
            clearInterval(timerId);
            btnStart.disabled = false;
            btnPause.disabled = true;
        });

        btnStop.addEventListener('click', () => {
            isPlaying = false;
            clearInterval(timerId);
            currentChord = "";
            sequenceIndex = 0; 
            chordNameEl.innerText = "Ready";
            chordDiagramEl.innerHTML = "";
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnStop.disabled = true;
        });

        bpmSlider.addEventListener('input', (e) => {
            currentBpm = e.target.value;
            bpmVal.innerText = `${currentBpm} BPM`;
            applyTimer(); 
        });
        
        categorySelect.addEventListener('change', () => {
            sequenceIndex = 0;
            // Toggle the custom input UI
            if (categorySelect.value === 'custom') {
                customInputSection.style.display = 'flex';
                updateFeedback();
            } else {
                customInputSection.style.display = 'none';
            }
        });

        customInput.addEventListener('input', () => {
            sequenceIndex = 0; // Reset progression if they type something new
            updateFeedback();
        });

        customSeqToggle.addEventListener('change', () => {
            sequenceIndex = 0; // Reset progression if they toggle mode
        });

    </script>
</body>
</html>
